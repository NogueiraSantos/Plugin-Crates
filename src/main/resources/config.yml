    NAME: '&#A303F9ᴀᴍᴇᴛʜʏѕᴛ ѕʜᴏᴠᴇʟ'
    LORE:
      - '&7Quebra 9 blocos de uma vez!'
      - '&8Auto Destruição'
      - '&8{time}'
